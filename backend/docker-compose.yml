version: "3.9"

services:
  catalog:
    image: python:3.12-slim
    working_dir: /app/backend/services/catalog
    volumes:
      - ..:/app
    command: >
      bash -c "pip install -r requirements.txt &&
      PYTHONPATH=/app/backend/shared:. python -m uvicorn app.main:app --host 0.0.0.0 --port 8002"
    ports: ["8002:8002"]
    env_file: ../.env.example

  ai_service:
    image: python:3.12-slim
    working_dir: /app/backend/services/ai_service
    volumes:
      - ..:/app
    command: >
      bash -c "pip install -r requirements.txt &&
      PYTHONPATH=/app/backend/shared:. python -m uvicorn app.main:app --host 0.0.0.0 --port 8003"
    ports: ["8003:8003"]
    env_file: ../.env.example

  gateway:
    image: python:3.12-slim
    working_dir: /app/backend/services/gateway
    volumes:
      - ..:/app
    command: >
      bash -c "pip install -r requirements.txt &&
      PYTHONPATH=/app/backend/shared:. python -m uvicorn app.main:app --host 0.0.0.0 --port 8001"
    ports: ["8001:8001"]
    env_file: ../.env.example
    depends_on: [catalog, ai_service]
